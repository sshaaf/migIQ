version: '3.8'

# Podman Compose for Local Development
# Mirrors OpenShift deployment for consistency

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quarkus-product-api
    ports:
      - "8080:8080"
    environment:
      # Match OpenShift ConfigMap
      APP_ENV: development
      QUARKUS_LOG_LEVEL: DEBUG
      QUARKUS_LOG_CATEGORY_COM_EXAMPLE_DEMO: DEBUG
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_HTTP_HOST: 0.0.0.0

      # H2 Database (in-memory)
      QUARKUS_DATASOURCE_DB_KIND: h2
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:h2:mem:testdb
      QUARKUS_DATASOURCE_USERNAME: sa
      QUARKUS_DATASOURCE_PASSWORD: ""

      # Hibernate
      QUARKUS_HIBERNATE_ORM_LOG_SQL: "true"
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: drop-and-create

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    networks:
      - app-network

    # Restart policy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

# Note: H2 is in-memory, no volumes needed
# If migrating to PostgreSQL, add:
# volumes:
#   postgres-data:
