name: Publish Skill Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'benchmark-results/**'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  publish-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Publish pass rate benchmarks (bigger is better)
      - name: Publish pass rate benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customBiggerIsBetter'
          output-file-path: benchmark-results/mig-prompt-builder-pass-rate.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
        continue-on-error: true

      # Publish duration benchmarks (smaller is better)
      - name: Publish duration benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-results/mig-prompt-builder-duration.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
        continue-on-error: true

      # Publish token usage benchmarks (smaller is better)
      - name: Publish token usage benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-results/mig-prompt-builder-tokens.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
        continue-on-error: true

      # mig-graphify
      - name: Publish mig-graphify pass rates
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customBiggerIsBetter'
          output-file-path: benchmark-results/mig-graphify-pass-rate.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
        continue-on-error: true
        if: hashFiles('benchmark-results/mig-graphify-pass-rate.json') != ''

      - name: Publish mig-graphify duration
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-results/mig-graphify-duration.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
        continue-on-error: true
        if: hashFiles('benchmark-results/mig-graphify-duration.json') != ''

      - name: Publish mig-graphify tokens
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-results/mig-graphify-tokens.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
        continue-on-error: true
        if: hashFiles('benchmark-results/mig-graphify-tokens.json') != ''

      # mig-plan
